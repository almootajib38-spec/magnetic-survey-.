<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المسح المغناطيسي الاحترافي</title>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
background:transparent;
margin:0;
padding:10px;
}

.card{
background:transparent;
padding:15px;
max-width:400px;
margin:auto;
}

h3{
font-size:28px;
margin-bottom:20px;
}

.box{
background:#efefef;
padding:15px;
border-radius:15px;
margin:10px 0;
text-align:right;
font-size:22px;
line-height:1.8;
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:12px;
font-size:22px;
cursor:pointer;
color:#fff;
}

.b{background:#3498db}
.g{background:#2ecc71}
.o{background:#f39c12}
.r{background:#e74c3c}
.dark{background:#2c3e50}
.gray{background:#7f8c8d}

.btn-group{
display:flex;
gap:10px;
}

.btn-group button{
flex:1;
}

#status-mode{
font-size:16px;
color:#777;
margin-bottom:10px;
text-align:left;
}
</style>
</head>

<body>

<div class="card">

<h3>المسح المغناطيسي العلمي المطور</h3>

<div id="status-mode">
الوضع: حساس حقيقي عبر Sketchware
</div>

<div class="box">
<div>
العمود الحالي:
<span id="line">1</span>
</div>

<div>
الخطوة الحالية في العمود:
<span id="step">0</span>
</div>

<hr>

<div>
إجمالي الأعمدة:
<span id="lines">1</span>
</div>

<div>
إجمالي الخطوات:
<span id="steps">0</span>
</div>
</div>

<div class="box">
X (µT):
<span id="cx">0</span><br>

Y (µT):
<span id="cy">0</span><br>

Z (µT):
<span id="cz">0</span><br>

إجمالي الشدة:
<span id="ct">0</span>
</div>

<button class="b">
الحساس يعمل تلقائياً
</button>

<div class="btn-group">
<button class="g"
onclick="changeStep(1)">
+ خطوة وتسجيل
</button>

<button class="r"
onclick="changeStep(-1)">
- تراجع خطوة
</button>
</div>

<div class="btn-group">
<button class="o"
onclick="changeLine(1)">
+ عمود جديد
</button>

<button class="r"
onclick="changeLine(-1)">
- تراجع عمود
</button>
</div>

<button class="dark"
onclick="saveCSV()">
تحميل CSV
</button>

<button class="gray"
onclick="resetData()">
إعادة التعيين
</button>

</div>

<script>

let line = 1;
let step = 0;
let lines = 1;
let steps = 0;

let mx = 0;
let my = 0;
let mz = 0;
let total = 0;

let dataLog = [];

// تستقبل القيم من Sketchware
function updateMagneticValues(
x,y,z,t){

mx = Number(x).toFixed(2);
my = Number(y).toFixed(2);
mz = Number(z).toFixed(2);
total = Number(t).toFixed(2);

document.getElementById("cx")
.innerText = mx;

document.getElementById("cy")
.innerText = my;

document.getElementById("cz")
.innerText = mz;

document.getElementById("ct")
.innerText = total;
}

// تسجيل خطوة
function changeStep(val){

if(step + val >= 0){

step += val;

if(val > 0){

steps++;

dataLog.push({
line: line,
step: step,
x: mx,
y: my,
z: mz,
total: total
});

}else if(val < 0 &&
steps > 0){

steps--;
dataLog.pop();
}

updateUI();
}
}

// تغيير عمود
function changeLine(val){

if(line + val >= 1){

line += val;

if(val > 0){
lines++;
step = 0;
}else{
if(lines > 1)
lines--;
}

updateUI();
}
}

// تحديث الواجهة
function updateUI(){

document.getElementById("line")
.innerText = line;

document.getElementById("step")
.innerText = step;

document.getElementById("lines")
.innerText = lines;

document.getElementById("steps")
.innerText = steps;
}

// إعادة ضبط
function resetData(){

dataLog = [];

line = 1;
step = 0;
lines = 1;
steps = 0;

updateUI();

alert("تم مسح البيانات");
}

// حفظ CSV
function saveCSV(){

if(dataLog.length === 0){
alert("لا توجد بيانات");
return;
}

let csv =
"العمود,الخطوة,X,Y,Z,Total\n";

dataLog.forEach(row => {

csv +=
`${row.line},${row.step},${row.x},${row.y},${row.z},${row.total}\n`;

});

const blob =
new Blob([csv],
{type:'text/csv'});

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
'magnetic_scan.csv';

a.click();
}

</script>

</body>
</html>
