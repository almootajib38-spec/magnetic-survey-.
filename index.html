<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المسح المغناطيسي الاحترافي - نسخة مستقرة</title>
<style>
body{font-family:Arial, sans-serif;text-align:center;background:#f4f7f6;padding:15px}
.card{background:#fff;padding:15px;border-radius:15px;max-width:400px;margin:auto;box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
.box{background:#eee;padding:10px;border-radius:10px;margin:10px;text-align:right}
button{width:100%;padding:12px;margin:5px 0;border:0;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;transition: 0.2s;}
button:active{transform: scale(0.98);}
.b{background:#3498db}
.g{background:#2ecc71}
.o{background:#f39c12}
.r{background:#e74c3c}
.stop-mode {background:#e74c3c !important;}

.btn-group {display: flex; gap: 10px; margin: 5px 0;}
.btn-group button {flex: 1; margin: 0;}
</style>
</head>
<body>

<div class="card">

<h3>المسح المغناطيسي العلمي المطور</h3>

<div style="font-size: 12px; color: #7f8c8d; text-align: left; padding: 0 10px;" id="status-mode">الوضع: متوقف</div>

<div class="box">
<div>العمود الحالي: <span id="line">1</span></div>
<div>الخطوة الحالية في العمود: <span id="step">0</span></div>
<hr>
<div>إجمالي الأعمدة: <span id="lines">1</span></div>
<div>إجمالي الخطوات الكلية المسجلة: <span id="steps">0</span></div>
</div>

<div class="box">
X (ميكروتسلا): <span id="cx">0</span><br>
Y (ميكروتسلا): <span id="cy">0</span><br>
Z (ميكروتسلا): <span id="cz">0</span><br>
إجمالي الشدة (Total): <span id="ct">0</span>
</div>

<button class="b" id="btn" onclick="toggle()">
تشغيل الحساس
</button>

<div class="btn-group">
    <button class="g" onclick="changeStep(1)">+ خطوة وتسجيل</button>
    <button class="r" onclick="changeStep(-1)">- تراجع عن خطوة</button>
</div>

<div class="btn-group">
    <button class="o" onclick="changeLine(1)">+ عمود جديد</button>
    <button class="r" onclick="changeLine(-1)">- تراجع عن عمود</button>
</div>

<button style="background: #2c3e50;" onclick="saveCSV()">تحميل ملف CSV</button>
<button style="background: #7f8c8d;" onclick="resetData()">مسح السجل وإعادة التعيين</button>

</div>

<script>
let on = false;
let magnetometer = null;
let line = 1, step = 0, lines = 1, steps = 0;
let mx = 0, my = 0, mz = 0, total = 0;
let dataLog = []; 
let simInterval = null; 

let smoothedX = 0, smoothedY = 0, smoothedZ = 0;
const alpha = 0.15; 

const txtX = document.getElementById("cx");
const txtY = document.getElementById("cy");
const txtZ = document.getElementById("cz");
const txtT = document.getElementById("ct");
const btnToggle = document.getElementById("btn");
const statusMode = document.getElementById("status-mode");

// دالة التبديل الآمنة تماماً
function toggle() {
    if (!on) {
        startSensor();
    } else {
        stopSensor();
    }
}

function startSensor() {
    on = true;
    btnToggle.innerText = "إيقاف الحساس";
    btnToggle.classList.add("stop-mode");
    
    // محاولة تشغيل المستشعر الفعلي مباشرة لتجنب تجمد الأذونات
    if ('Magnetometer' in window) {
        try {
            magnetometer = new Magnetometer({frequency: 20}); 
            magnetometer.addEventListener('reading', () => {
                if (smoothedX === 0 && smoothedY === 0 && smoothedZ === 0) {
                    smoothedX = magnetometer.x;
                    smoothedY = magnetometer.y;
                    smoothedZ = magnetometer.z;
                } else {
                    smoothedX = smoothedX + alpha * (magnetometer.x - smoothedX);
                    smoothedY = smoothedY + alpha * (magnetometer.y - smoothedY);
                    smoothedZ = smoothedZ + alpha * (magnetometer.z - smoothedZ);
                }

                mx = smoothedX.toFixed(2);
                my = smoothedY.toFixed(2);
                mz = smoothedZ.toFixed(2);
                total = Math.sqrt(mx*mx + my*my + mz*mz).toFixed(2);
                updateUI();
            });

            magnetometer.addEventListener('error', event => {
                // إذا رفض المتصفح الحساس بسبب الـ HTTPS أو الأمان، شغل المحاكاة فوراً
                if(on) activateSimulation("خطأ في التشغيل: تم تفعيل المحاكاة الآمنة");
            });

            magnetometer.start();
            statusMode.innerText = "الوضع: حساس حقيقي ومستقر";
        } catch (e) {
            activateSimulation("النظام لا يسمح: وضع المحاكاة");
        }
    } else {
        activateSimulation("المتصفح لا يدعم: وضع المحاكاة");
    }
}

function stopSensor() {
    on = false;
    btnToggle.innerText = "تشغيل الحساس";
    btnToggle.classList.remove("stop-mode");
    statusMode.innerText = "الوضع: متوقف";

    if (magnetometer) {
        try { magnetometer.stop(); } catch(e){}
        magnetometer = null;
    }
    if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
    }
    
    mx = 0; my = 0; mz = 0; total = 0;
    updateUI();
}

function activateSimulation(msg) {
    statusMode.innerText = "الوضع: محاكاة (بسبب قيود أمان المتصفح)";
    if(simInterval) clearInterval(simInterval);
    
    let baseX = 18.2, baseY = -15.4, baseZ = 42.1; 

    simInterval = setInterval(() => {
        mx = (baseX + (Math.random() * 0.3 - 0.15)).toFixed(2);
        my = (baseY + (Math.random() * 0.3 - 0.15)).toFixed(2);
        mz = (baseZ + (Math.random() * 0.3 - 0.15)).toFixed(2);
        total = Math.sqrt(mx*mx + my*my + mz*mz).toFixed(2);
        updateUI();
    }, 200);
}

function updateUI() {
    txtX.innerText = mx;
    txtY.innerText = my;
    txtZ.innerText = mz;
    txtT.innerText = total;
    
    document.getElementById("line").innerText = line;
    document.getElementById("step").innerText = step;
    document.getElementById("lines").innerText = lines;
    document.getElementById("steps").innerText = steps;
}

function changeStep(val) {
    if (!on) { alert("يرجى تشغيل الحساس أولاً لتسجيل الخطوات!"); return; }
    if (step + val >= 0) {
        step += val;
        if (val > 0) {
            steps++;
            dataLog.push({ line: line, step: step, x: mx, y: my, z: mz, total: total });
        } else if (val < 0 && steps > 0) {
            steps--;
            dataLog.pop();
        }
        updateUI();
    }
}

function changeLine(val) {
    if (line + val >= 1) {
        line += val;
        if (val > 0) {
            lines++;
            step = 0; 
        } else {
            if(lines > 1) lines--;
        }
        updateUI();
    }
}

function resetData() {
    if (dataLog.length === 0) {
        alert("السجل فارغ بالفعل.");
        return;
    }
    if (confirm("هل أنت متأكد من رغبتك في مسح جميع البيانات؟")) {
        stopSensor();
        dataLog = [];
        line = 1; step = 0; lines = 1; steps = 0;
        mx = 0; my = 0; mz = 0; total = 0;
        updateUI();
    }
}

function saveCSV() {
    if (dataLog.length === 0) {
        alert("لا توجد بيانات مسجلة!");
        return;
    }
    let csvContent = "data:text/csv;charset=utf-8,العمود,الخطوة,X,Y,Z,Total\n";
    dataLog.forEach(row => {
        csvContent += `${row.line},${row.step},${row.x},${row.y},${row.z},${row.total}\n`;
    });
    
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "magnetic_scan_data.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
